<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palavra &amp; Paz — @palavraepaz.oficial</title>
  <meta name="description" content="Materiais devocionais e estudos cristãos separados para edificar sua caminhada diária com Deus." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface-soft: #FBF9F5;
      --border: #E6E1D6;
      --text: #1C1C1C;
      --muted: #5E5951;
      --accent: #3B342C;
      --accent-hover: #241F1A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
      min-height: 100vh;
      padding: 2.5rem 1rem 3.5rem;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .avatar-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(28, 28, 28, 0.05);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .monogram {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .brand-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.65rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .handle {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 0.9rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 440px;
      margin: 0 auto;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.05rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(28, 28, 28, 0.06);
    }

    .thumb {
      width: 84px;
      height: 106px;
      flex-shrink: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-fallback {
      text-align: center;
      padding: 0.4rem;
      font-family: 'Lora', Georgia, serif;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .thumb-fallback span {
      display: block;
      font-size: 1.15rem;
      margin-bottom: 0.2rem;
      color: var(--accent);
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.28rem;
    }

    .card-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.32;
      margin-bottom: 0.4rem;
    }

    .card-desc {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      color: #FAF8F5;
      background-color: var(--accent);
      padding: 0.5rem 0.95rem;
      border-radius: 8px;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 440px) {
      .card {
        padding: 0.9rem;
        gap: 0.85rem;
      }
      .thumb {
        width: 74px;
        height: 94px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="avatar-wrap" id="avatarWrap">
        <img src="assets/logo.jpg" alt="Logo Palavra &amp; Paz" onerror="this.parentElement.innerHTML='<span class=\'monogram\'>P&amp;P</span>'" />
      </div>
      <h1 class="brand-title">Palavra &amp; Paz</h1>
      <p class="handle">@palavraepaz.oficial</p>
      <p class="subtitle">
        Jesus Cristo no centro de tudo ✝️ — Materiais devocionais e estudos separados com carinho para edificar sua caminhada diária com Deus.
      </p>
    </header>

    <section class="cards-list" id="cardsList" aria-label="Materiais cristãos recomendados">
      <!-- Carregado dinamicamente via links.json -->
    </section>

    <footer class="footer">
      <p>@palavraepaz.oficial • Palavra de Deus todos os dias</p>
    </footer>
  </main>

  <script>
    async function loadLinks() {
      const container = document.getElementById('cardsList');
      try {
        const res = await fetch('links.json', { cache: 'no-store' });
        const items = await res.json();

        container.innerHTML = items.map(item => `
          <article class="card">
            <div class="thumb">
              <img
                src="${item.imagem}"
                alt="${item.titulo}"
                loading="lazy"
                onerror="this.parentElement.innerHTML='<div class=\'thumb-fallback\'><span>✝</span>P&amp;P</div>'"
              />
            </div>
            <div class="card-body">
              ${item.tag ? `<span class="tag">${item.tag}</span>` : ''}
              <h2 class="card-title">${item.titulo}</h2>
              <p class="card-desc">${item.descricao}</p>
              <a class="btn" href="${item.url}" target="_blank" rel="noopener noreferrer">
                Conhecer material
              </a>
            </div>
          </article>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="text-align:center;color:#5E5951;">Não foi possível carregar os materiais no momento.</p>';
      }
    }

    loadLinks();
  </script>
</body>
</html>
