<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palavra &amp; Paz — @palavraepaz.oficial</title>
  <meta name="description" content="Materiais devocionais e estudos cristãos separados para edificar sua caminhada diária com Deus." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface-soft: #FAF8F4;
      --border: #E6E1D6;
      --text: #1C1C1C;
      --muted: #5E5951;
      --accent: #3B342C;
      --accent-hover: #241F1A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding: 2.25rem 1rem 3.5rem;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .avatar-wrap {
      width: 86px;
      height: 86px;
      margin: 0 auto 0.9rem;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(28, 28, 28, 0.05);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .monogram {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .brand-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .handle {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 0.85rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(28, 28, 28, 0.07);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 0.45rem;
      display: block;
    }

    .thumb-fallback {
      text-align: center;
      padding: 1rem;
      font-family: 'Lora', Georgia, serif;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .thumb-fallback span {
      display: block;
      font-size: 1.5rem;
      margin-bottom: 0.3rem;
      color: var(--accent);
    }

    .card-body {
      padding: 1.05rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .card-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.32;
      margin-bottom: 0.45rem;
    }

    .card-desc {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 1rem;
      line-height: 1.48;
    }

    .btn {
      margin-top: auto;
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 500;
      color: #FAF8F5;
      background-color: var(--accent);
      padding: 0.58rem 0.9rem;
      border-radius: 8px;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Tablet (600px a 900px) */
    @media (max-width: 900px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
    }

    /* Celular (abaixo de 600px): 2 cards lado a lado compactos */
    @media (max-width: 600px) {
      body {
        padding: 1.4rem 0.75rem 2.5rem;
      }
      .header {
        margin-bottom: 1.5rem;
      }
      .avatar-wrap {
        width: 70px;
        height: 70px;
      }
      .brand-title {
        font-size: 1.4rem;
      }
      .subtitle {
        font-size: 0.85rem;
      }
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .card-body {
        padding: 0.75rem;
      }
      .tag {
        font-size: 0.64rem;
        margin-bottom: 0.22rem;
      }
      .card-title {
        font-size: 0.88rem;
        margin-bottom: 0.35rem;
      }
      .card-desc {
        font-size: 0.76rem;
        margin-bottom: 0.75rem;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .btn {
        font-size: 0.76rem;
        padding: 0.5rem 0.6rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="avatar-wrap" id="avatarWrap">
        <img src="assets/logo.jpg" alt="Logo Palavra &amp; Paz" onerror="this.parentElement.innerHTML='<span class=\'monogram\'>P&amp;P</span>'" />
      </div>
      <h1 class="brand-title">Palavra &amp; Paz</h1>
      <p class="handle">@palavraepaz.oficial</p>
      <p class="subtitle">
        Jesus Cristo no centro de tudo ✝️ — Materiais devocionais e estudos separados com carinho para edificar sua caminhada diária com Deus.
      </p>
    </header>

    <section class="cards-grid" id="cardsGrid" aria-label="Materiais cristãos recomendados">
      <!-- Carregado dinamicamente via links.json -->
    </section>

    <footer class="footer">
      <p>@palavraepaz.oficial • Palavra de Deus todos os dias</p>
    </footer>
  </main>

  <script>
    async function loadLinks() {
      const container = document.getElementById('cardsGrid');
      try {
        const res = await fetch('links.json', { cache: 'no-store' });
        const items = await res.json();

        container.innerHTML = items.map(item => `
          <article class="card">
            <div class="thumb">
              <img
                src="${item.imagem}"
                alt="${item.titulo}"
                loading="lazy"
                onerror="this.parentElement.innerHTML='<div class=\'thumb-fallback\'><span>✝</span>P&amp;P</div>'"
              />
            </div>
            <div class="card-body">
              ${item.tag ? `<span class="tag">${item.tag}</span>` : ''}
              <h2 class="card-title">${item.titulo}</h2>
              <p class="card-desc">${item.descricao}</p>
              <a class="btn" href="${item.url}" target="_blank" rel="noopener noreferrer">
                Conhecer material
              </a>
            </div>
          </article>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="text-align:center;color:#5E5951;grid-column:1/-1;">Não foi possível carregar os materiais no momento.</p>';
      }
    }

    loadLinks();
  </script>
</body>
</html>
