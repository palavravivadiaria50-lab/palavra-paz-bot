name: Palavra e Paz - Publicacao Diaria (Imagens)

on:
  schedule:
    # 07:00 BRT (10:00 UTC) -> devocional_manha (Carrossel Feed IG + FB)
    - cron: '0 10 * * *'
    # 08:00 BRT (11:00 UTC) -> versiculo_dia (Card Feed + Stories IG + FB)
    - cron: '0 11 * * *'
    # 15:00 BRT (18:00 UTC) -> palavra_animo (Card Feed + Stories IG + FB)
    - cron: '0 18 * * *'
    # 22:00 BRT (01:00 UTC) -> devocional_noite (Carrossel Feed IG + FB)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Bloco para publicar manualmente'
        required: true
        type: choice
        options:
          - devocional_manha
          - versiculo_dia
          - palavra_animo
          - devocional_noite

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar .env a partir dos Secrets
        shell: pwsh
        run: |
          @"
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          CHANNEL_HANDLE=@palavraepaz
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Executar publicacao do slot
        shell: pwsh
        run: |
          $slot = "${{ github.event.inputs.slot }}"
          if (-not $slot) {
            switch ("${{ github.event.schedule }}") {
              "0 10 * * *" { $slot = "devocional_manha" }
              "0 11 * * *" { $slot = "versiculo_dia" }
              "0 18 * * *" { $slot = "palavra_animo" }
              "0 1 * * *"  { $slot = "devocional_noite" }
              default      { throw "Schedule nao mapeado: ${{ github.event.schedule }}" }
            }
          }
          Write-Host "Executando slot: $slot"
          python -u main.py --slot $slot

      - name: Commit e push do historico de versiculos
        shell: pwsh
        run: |
          git config user.name "palavra-paz-bot"
          git config user.email "bot@palavraepaz.local"
          git add data/historico_versiculos.json data/weekly_batch.json
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore: atualiza historico NTLH e lote semanal"
            git push
          } else {
            Write-Host "Sem alteracoes em data/ para commitar."
          }
